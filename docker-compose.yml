name: chaos-pipeline

# Configuración común de los servicios de Airflow (se reutiliza con <<: *airflow-common)
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
  image: chaos-airflow:${AIRFLOW_VERSION:-3.3.2}
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor          # las tareas corren dentro del scheduler (sin Celery ni Redis)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # sin login: SOLO para uso local (el puerto va a 127.0.0.1)
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Ajustes para gastar menos memoria en un portátil
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__CORE__PARALLELISM: "4"
    # Para que las tareas encuentren S3 dentro de la red de Docker
    S3_ENDPOINT: http://s3:9000
    S3_ROOT_USER: ${S3_ROOT_USER}
    S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./transform:/opt/airflow/project/transform:ro
    - ./schemas:/opt/airflow/project/schemas:ro

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: redpanda
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --default-log-level=info
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"     # 8080 es de Airflow
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  s3:
    image: pgsty/minio:${S3_VERSION:-latest}
    container_name: s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    mem_limit: 512m
    restart: unless-stopped

  # ---------------- Airflow ----------------
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped

  # Prepara la base de datos de Airflow y termina (se ejecuta una vez en cada arranque)
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"     # solo accesible desde tu PC
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1536m
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped

volumes:
  redpanda_data:
  s3_data:
  airflow_pg_data: